# Deploy no Coolify: "Docker Compose" como tipo de recurso, apontando para este repositório.
# Variáveis (preencher na aba Environment Variables do Coolify): veja .env.example
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: politica
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
      POSTGRES_DB: politica
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U politica -d politica"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:?defina a chave publicável do Clerk}
        NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
        NEXT_PUBLIC_CLERK_SIGN_UP_URL: /sign-up
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment: &app-env
      DATABASE_URL: postgresql://politica:${POSTGRES_PASSWORD}@db:5432/politica?schema=public
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:?defina CLERK_SECRET_KEY}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-5-5}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      APP_URL: ${APP_URL:-}
      CRON_SECRET: ${CRON_SECRET:-}
      TZ: America/Sao_Paulo
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # robô: coleta notícias de hora em hora, envia alertas e o resumo diário das 7h
  worker:
    build:
      context: .
      args:
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *app-env
      INGEST_CRON: ${INGEST_CRON:-0 * * * *}
      DIGEST_CRON: ${DIGEST_CRON:-0 7 * * *}
    command: ["sh", "-c", "npx prisma migrate deploy && npm run worker"]

volumes:
  pgdata:
