# Postgres para desenvolvimento local: docker compose -f docker-compose.dev.yml up -d
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: politica
      POSTGRES_PASSWORD: politica
      POSTGRES_DB: politica
    ports:
      - "5432:5432"
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
volumes:
  pgdata-dev:
